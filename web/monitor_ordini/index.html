<!DOCTYPE html>
<html>
<head>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

   <link rel="stylesheet" href="monitor_ordini_lib/themes/style.css" />
   <script src="monitor_ordini_lib/jquery/jquery-1.11.3.min.js"></script>
   <script src="monitor_ordini_lib/utils/main.js"></script>
</head>
<body>
  <div class="hiddenBlock">
        <p>Errore di connessione al Gestionale Sagra. Controlla la connettività</p>
  </div>
<div class="sectiontitle">
    <h2>Monitor Sagra</h2>
    <span class="headerLine"></span>
</div>
<div id="projectFacts" class="sectionClass">
    <div class="fullWidth eight columns">
        <div class="projectFactsWrap ">
            <div id="cucina" name="reparto" class="item wow fadeInUpBig animated animated" style="display:none;">
                <object class="svgImage" type="image/svg+xml" data="monitor_ordini_lib/themes/images/cucina.svg"></object>
                <p id="cucina_no" class="number"></p>
                <span></span>
                <p>Cucina</p>
            </div>
            <div id="bar" name="reparto" class="item wow fadeInUpBig animated animated" style="display:none;">
                <object class="svgImage" type="image/svg+xml" data="monitor_ordini_lib/themes/images/bar.svg"></object>
                <p id="bar_no" class="number"></p>
                <span></span>
                <p>Bar</p>
            </div>
            <div id="pizzeria" name="reparto" class="item wow fadeInUpBig animated animated" style="display:none;">
                <object class="svgImage" type="image/svg+xml" data="monitor_ordini_lib/themes/images/pizzeria.svg"></object>
                <p id="pizzeria_no" class="number"></p>
                <span></span>
                <p>Pizzeria</p>
            </div>
            <div id="rosticceria" name="reparto" class="item wow fadeInUpBig animated animated" style="display:none;">
                <object class="svgImage" type="image/svg+xml" data="monitor_ordini_lib/themes/images/rosticceria.svg"></object>
                <p id="rosticceria_no" class="number"></p>
                <span></span>
                <p>Rosticceria</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
