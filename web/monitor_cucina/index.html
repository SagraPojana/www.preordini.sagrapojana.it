<!DOCTYPE html>

   <style>/* Titoli grandi */
h1 {
    margin: 5px 0;
    font-size: 2em;
    text-align: center;
}

/* Header colonne */
h3 {
    margin: 0;
    font-size: 1em;
    text-align: center;
}

/* Tabella principale */
.main-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}

/* Colonne */
.col {
    width: 33.33%;
    vertical-align: top;
    border-right: 2px solid #ccc;
}

.col:last-child {
    border-right: none;
}

/* Tabelle interne */
.inner-table {

    table-layout: fixed;
    border-collapse: collapse;
}

/* Riga header (Descrizione / QTA) */
.inner-table thead tr:last-child {
    border-bottom: 2px solid #ccc;
}

/* Celle */
.inner-table td {
    border-bottom: 3px solid #eee;
    padding: 6px;
}

/* Descrizione */
.inner-table .desc {
    width: 100% ;
}

/* Quantità */
.inner-table .qty {
    width: 100px;
    text-align: center;
}

/* Numeri grandi */
.inner-table td:last-child {
    text-align: center;
    font-size: 1.6em;
    font-weight: bold;
}
</style>
</head>
