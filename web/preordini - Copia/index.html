<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sagra Pre-Ordine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#EF6C00',
                        secondary: '#FFA726',
                        bg: '#FFF3E0',
                        textPrimary: '#212121',
                        textSecondary: '#757575'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FFF3E0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; height: 100dvh; }
        .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #EF6C00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden">

    <!-- HEADER -->
    <header class="bg-primary text-black shadow-md z-20 shrink-0">
        <div class="flex items-center justify-between px-4 py-3">
            <h1 class="text-xl font-bold" id="header-title">Ordini Sagra</h1>
            <button id="trash-btn" class="p-2 opacity-50" onclick="confirmClearOrder()">
                <i class="fas fa-trash-alt text-xl"></i>
            </button>
        </div>
        <div id="search-bar-container" class="px-4 pb-3">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Cerca pietanza..." class="w-full pl-10 pr-10 py-2 rounded-xl border-none shadow-sm text-textPrimary" oninput="filterMenu()">
                <button onclick="clearSearch()" class="absolute right-3 top-3 text-gray-400" id="clear-search-btn" style="display:none;"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex overflow-x-auto gap-2 mt-3 hide-scrollbar pb-1" id="category-filters"></div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto relative scroll-smooth" id="main-container">
        <div id="loading-screen" class="flex flex-col items-center justify-center h-full space-y-4">
            <div class="loader"></div>
            <p class="text-primary font-bold">Caricamento menu...</p>
        </div>

        <div id="error-screen" class="hidden flex flex-col items-center justify-center h-full space-y-4 p-6 text-center">
            <i class="fas fa-exclamation-triangle text-4xl text-red-500"></i>
            <p class="text-gray-600 font-bold" id="error-message">Errore connessione.</p>
            <button onclick="location.reload()" class="bg-primary text-white px-6 py-2 rounded-lg font-bold">Riprova</button>
        </div>
        
        <div id="view-menu" class="hidden p-4 pb-24 space-y-6"><div id="menu-list"></div></div>

        <div id="view-summary" class="hidden p-4 pb-24 h-full bg-white">
            <div class="flex items-center mb-4 text-primary cursor-pointer" onclick="goToMenu()"><i class="fas fa-arrow-left mr-2"></i> Torna al Menu</div>
            <h2 class="text-2xl font-bold text-primary mb-4">Riepilogo Carrello</h2>
            <div id="cart-list" class="space-y-3 mb-6"></div>
            <div id="empty-cart-msg" class="text-center text-gray-400 py-10 hidden"><i class="fas fa-utensils text-4xl mb-3"></i><p>Il listino è vuoto</p></div>
            <div class="border-t pt-4 mb-6"><div class="flex justify-between items-center text-xl font-bold text-primary"><span>Totale</span><span id="summary-total">0.00 Euro</span></div></div>
        </div>

        <div id="view-userdata" class="hidden p-4 pb-24 h-full bg-white">
            <div class="flex items-center mb-4 text-primary cursor-pointer" onclick="goToSummary()"><i class="fas fa-arrow-left mr-2"></i> Torna al Riepilogo</div>
            <h2 class="text-2xl font-bold text-primary mb-4">I tuoi Dati</h2>
            <div class="bg-bg p-4 rounded-xl border border-orange-200 space-y-4">
                <div><label class="block text-xs text-textSecondary mb-1 font-bold">Cliente</label><input type="text" id="input-cliente" class="w-full p-3 rounded-lg border border-gray-300 outline-none" placeholder="Il tuo nome"></div>
                <div class="flex gap-4">
                    <div class="flex-1"><label class="block text-xs text-textSecondary mb-1 font-bold">Tavolo</label><input type="text" id="input-tavolo" class="w-full p-3 rounded-lg border border-gray-300 outline-none" placeholder="Es. 5"></div>
                    <div class="flex-1"><label class="block text-xs text-textSecondary mb-1 font-bold">Coperti</label><input type="number" id="input-coperti" oninput="updateFooter()" class="w-full p-3 rounded-lg border border-gray-300 outline-none" placeholder="0"></div>
                </div>
                <div><label class="block text-xs text-textSecondary mb-1">Note (Opzionale)</label><textarea id="input-note" class="w-full p-3 rounded-lg border border-gray-300 outline-none" rows="2" placeholder="Intolleranze..."></textarea></div>
                <div class="flex items-center gap-2 mt-2">
                    <input type="checkbox" id="input-asporto" onchange="updateFooter()" class="w-5 h-5 text-primary border-gray-300 rounded">
                    <label for="input-asporto" class="text-textPrimary">Ordine per Asporto</label>
                </div>
            </div>
        </div>

        <div id="view-qr" class="hidden flex flex-col items-center justify-center h-full p-6 bg-white text-center">
            <h2 class="text-2xl font-bold text-primary mb-2">Ordine Pronto!</h2>
            <p class="text-gray-500 mb-8">Mostra questo codice in cassa.</p>
            <div class="bg-white p-4 rounded-xl shadow-lg border border-gray-100 mb-8 flex justify-center items-center"><canvas id="qrcode-canvas"></canvas></div>
            <div class="text-lg font-bold text-textPrimary mb-8">Totale: <span id="qr-total" class="text-primary"></span></div>
            <button onclick="goToUserData()" class="text-textSecondary underline">Modifica Dati</button>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-bar" class="hidden bg-white border-t p-4 shadow-md z-20 safe-bottom">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div><p class="text-xs text-textSecondary uppercase font-bold">Totale</p><p class="text-2xl font-extrabold text-primary" id="footer-total">0.00 Euro</p></div>
            <button id="main-action-btn" onclick="goToSummary()" class="bg-primary text-white font-bold py-3 px-8 rounded-xl shadow-md active:scale-95 transition-all flex items-center">
                <span>Riepilogo</span><i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- MODAL VARIANTI -->
    <div id="variant-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b bg-bg"><h3 class="font-bold text-lg text-primary" id="modal-title">Personalizza</h3></div>
            <div class="p-4 overflow-y-auto flex-1" id="modal-content"></div>
            <div class="p-4 border-t flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 text-textSecondary font-medium">Annulla</button>
                <button onclick="confirmVariantAdd()" class="px-6 py-2 bg-primary text-white rounded-lg font-bold shadow-md">Aggiungi</button>
            </div>
        </div>
    </div>

    <script>
        let menuData = [];
        let state = { cart: [], selectedCategory: null, searchQuery: "", tempVariantItem: null, tempVariants: {}, config: {} };
        const API_BASE = "/rest";

        document.addEventListener('DOMContentLoaded', initApp);

        async function initApp() {
            try {
                await fetchMenuData();
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('view-menu').classList.remove('hidden');
                document.getElementById('footer-bar').classList.remove('hidden');
                renderCategories();
                renderMenu();
                updateFooter();
            } catch (error) {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('error-screen').classList.remove('hidden');
            }
        }

        async function fetchMenuData() {
            const configResp = await fetch(`${API_BASE}/configurazione`);
            if (configResp.ok) state.config = await configResp.json();
            
            const tipologieResp = await fetch(`${API_BASE}/tipologie`);
            const tipologie = await tipologieResp.json();

            const promises = tipologie.map(async (cat) => {
                const artResp = await fetch(`${API_BASE}/nuova_articoli_ingrediente_per_tipologia/${cat.id}`);
                const articoli = artResp.ok ? await artResp.json() : [];
                return { id: cat.id, title: cat.descrizione, articoli: articoli };
            });

            menuData = (await Promise.all(promises)).filter(s => s.articoli.length > 0);
        }

        function renderCategories() {
            const container = document.getElementById('category-filters');
            let html = `<button onclick="filterCategory(null)" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold border ${state.selectedCategory === null ? 'bg-primary text-white' : 'bg-white'}">TUTTI</button>`;
            menuData.forEach(cat => {
                html += `<button onclick="filterCategory(${cat.id})" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold border ${state.selectedCategory === cat.id ? 'bg-primary text-white' : 'bg-white'}">${cat.title.toUpperCase()}</button>`;
            });
            container.innerHTML = html;
        }

        function renderMenu() {
            const container = document.getElementById('menu-list');
            const query = state.searchQuery.toLowerCase();
            let html = '';
            let foundAny = false;

            menuData.forEach(cat => {
                if (state.selectedCategory && state.selectedCategory !== cat.id) return;
                const filteredItems = cat.articoli.filter(item => item.descrizione.toLowerCase().includes(query));
                if (filteredItems.length > 0) {
                    foundAny = true;
                    html += `<h3 class="text-primary font-bold text-lg mb-2 sticky top-0 bg-bg py-2 z-10">${cat.title}</h3>`;
                    filteredItems.forEach(item => {
                        const qty = getQuantityInCart(item.id);
                        // MOSTRA "Personalizzabile" solo se ci sono ingredienti NON obbligatori
                        const hasOptional = item.ingredienti && item.ingredienti.some(ing => !ing.obbligatorio);
                        html += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-orange-100 flex justify-between items-center mb-3">
                            <div class="flex-1 pr-2">
                                <div class="font-bold text-textPrimary text-lg">${item.descrizione}</div>
                                <div class="text-secondary font-bold mt-1">${item.prezzo.toFixed(2)} Euro</div>
                                ${hasOptional ? '<div class="text-xs text-gray-400 mt-1 italic">Personalizzabile</div>' : ''}
                            </div>
                            <div class="flex items-center bg-bg rounded-full p-1 shrink-0">
                                <button onclick="removeFromCartSimple(${item.id})" class="w-10 h-10 flex items-center justify-center rounded-full ${qty > 0 ? 'bg-white text-red-500' : 'text-gray-300'}" ${qty === 0 ? 'disabled' : ''}><i class="fas fa-minus"></i></button>
                                <span class="w-8 text-center font-bold text-textPrimary">${qty}</span>
                                <button onclick="addToCartClick(${item.id})" class="w-10 h-10 flex items-center justify-center rounded-full bg-primary text-white shadow-md"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>`;
                    });
                }
            });
            container.innerHTML = foundAny ? html : '<div class="text-center py-10 text-gray-400">Nessun prodotto trovato.</div>';
        }

        function addToCartClick(itemId) {
            const item = findArticleById(itemId);
            if (!item) return;
            const hasOptional = item.ingredienti && item.ingredienti.some(ing => !ing.obbligatorio);
            if (hasOptional) {
                openVariantModal(item);
            } else {
                const autoVariants = {};
                if (item.ingredienti) {
                    item.ingredienti.forEach(ing => { if (ing.obbligatorio) autoVariants[ing.id] = 1; });
                }
                addToCart(item, Object.keys(autoVariants).length > 0 ? autoVariants : null);
            }
        }

        function openVariantModal(item) {
            state.tempVariantItem = item;
            state.tempVariants = {};
            item.ingredienti.forEach(ing => { if (ing.obbligatorio) state.tempVariants[ing.id] = 1; });
            document.getElementById('modal-title').innerText = item.descrizione;
            let html = '';
            item.ingredienti.forEach(ing => {
                if (ing.obbligatorio) return; // Non mostriamo gli obbligatori nel popup
                const initialQty = state.tempVariants[ing.id] || 0;
                html += `
                <div class="flex justify-between items-center py-3 border-b border-gray-100 last:border-0">
                    <div>
                        <div class="font-bold text-textPrimary">${ing.descrizione}</div>
                        <div class="text-xs text-textSecondary">${ing.prezzo > 0 ? '+' + ing.prezzo.toFixed(2) + '€' : 'Gratis'}</div>
                    </div>
                    <div class="flex items-center bg-gray-100 rounded-lg">
                        <button onclick="updateTempVariant(${ing.id}, -1, false)" class="px-3 py-1 text-primary font-bold text-xl">-</button>
                        <span id="var-qty-${ing.id}" class="px-2 font-bold w-6 text-center">${initialQty}</span>
                        <button onclick="updateTempVariant(${ing.id}, 1, false, ${ing.quantita_massima || 99})" class="px-3 py-1 text-primary font-bold text-xl">+</button>
                    </div>
                </div>`;
            });
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('variant-modal').classList.remove('hidden');
        }

        function updateTempVariant(ingId, delta, isMandatory, max = 99) {
            const current = state.tempVariants[ingId] || 0;
            const min = isMandatory ? 1 : 0;
            const newVal = current + delta;
            if (newVal >= min && newVal <= max) {
                state.tempVariants[ingId] = newVal;
                if (newVal === 0) delete state.tempVariants[ingId];
                document.getElementById(`var-qty-${ingId}`).innerText = newVal;
            }
        }

        function confirmVariantAdd() {
            const finalVariants = Object.keys(state.tempVariants).length > 0 ? {...state.tempVariants} : null;
            addToCart(state.tempVariantItem, finalVariants);
            closeModal();
        }

        function closeModal() { document.getElementById('variant-modal').classList.add('hidden'); state.tempVariantItem = null; state.tempVariants = {}; }

        function addToCart(item, variants) {
            const existing = state.cart.find(i => i.articolo.id === item.id && JSON.stringify(i.varianti) === JSON.stringify(variants));
            if (existing) { existing.quantity++; } 
            else { state.cart.push({ uniqueId: Date.now() + Math.random(), articolo: item, quantity: 1, varianti: variants }); }
            refreshUI();
        }

        function removeFromCartSimple(itemId) {
            const index = state.cart.findLastIndex(i => i.articolo.id === itemId);
            if (index > -1) {
                if (state.cart[index].quantity > 1) state.cart[index].quantity--;
                else state.cart.splice(index, 1);
                refreshUI();
            }
        }

        function findArticleById(id) { for (const cat of menuData) { const f = cat.articoli.find(a => a.id === id); if (f) return f; } return null; }
        function getQuantityInCart(itemId) { return state.cart.filter(i => i.articolo.id === itemId).reduce((sum, i) => sum + i.quantity, 0); }
        function refreshUI() { renderMenu(); renderCart(); updateFooter(); }
        function removeCartItem(uId) { state.cart = state.cart.filter(i => i.uniqueId !== uId); refreshUI(); }
        function confirmClearOrder() { if (state.cart.length > 0 && confirm("Cancellare l'ordine?")) { state.cart = []; goToMenu(); refreshUI(); } }

        function renderCart() {
            const container = document.getElementById('cart-list');
            if (state.cart.length === 0) { container.innerHTML = ''; document.getElementById('empty-cart-msg').classList.remove('hidden'); return; }
            document.getElementById('empty-cart-msg').classList.add('hidden');
            let html = '';
            state.cart.forEach(item => {
                let variantText = '';
                if (item.varianti) {
                    const parts = [];
                    for (const [id, qta] of Object.entries(item.varianti)) {
                        const ing = item.articolo.ingredienti.find(i => i.id == id);
                        if (ing && !ing.obbligatorio) parts.push(`${qta > 1 ? qta + 'x ' : ''}${ing.descrizione}`);
                    }
                    if (parts.length > 0) variantText = `<div class="text-sm text-textSecondary italic">+ ${parts.join(', ')}</div>`;
                }
                const price = (getItemUnitPrice(item) * item.quantity).toFixed(2);
                html += `
                <div class="flex justify-between items-start py-2 border-b border-gray-100">
                    <div class="flex items-center">
                        <button onclick="removeCartItem(${item.uniqueId})" class="mr-3 text-red-400 p-2"><i class="fas fa-trash-alt"></i></button>
                        <div><div class="font-bold text-textPrimary"><span class="text-primary">${item.quantity}x</span> ${item.articolo.descrizione}</div>${variantText}</div>
                    </div>
                    <div class="font-bold">${price} Euro</div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function getItemUnitPrice(item) {
            let p = item.articolo.prezzo;
            if (item.varianti) {
                for (const [id, qta] of Object.entries(item.varianti)) {
                    const ing = item.articolo.ingredienti.find(i => i.id == id);
                    if (ing && !ing.obbligatorio) p += (ing.prezzo * qta);
                }
            }
            return p;
        }

        function calculateTotal() {
            let total = state.cart.reduce((acc, i) => acc + (getItemUnitPrice(i) * i.quantity), 0);
            const coperti = parseInt(document.getElementById('input-coperti').value) || 0;
            const asporto = document.getElementById('input-asporto').checked;
            if (coperti > 0) {
                const costo_coperto = coperti ? parseFloat(state.config.costo_coperto || 0) : 0;
                total += (coperti * costo_coperto);
            }			
			const costo_asporto = asporto ? parseFloat(state.config.costo_asporto || 0) : 0;
			total += costo_asporto;
				
            return total;
        }

		function updateFooter() {
			const total = calculateTotal().toFixed(2) + ' €'; // Simbolo diretto
			document.getElementById('footer-total').innerHTML = total;
			document.getElementById('summary-total').innerHTML = total;
			document.getElementById('qr-total').innerHTML = total;
			
			const count = state.cart.reduce((s, i) => s + i.quantity, 0);
			const btn = document.getElementById('main-action-btn');
			
			btn.classList.toggle('opacity-50', count === 0);
			document.getElementById('trash-btn').classList.toggle('opacity-50', count === 0);
		}

        // NAVIGAZIONE
        function goToSummary() { if (state.cart.length === 0) return; switchView('view-summary', 'Riepilogo'); renderCart(); }
        function goToUserData() { switchView('view-userdata', 'I tuoi Dati'); }
        function goToMenu() { switchView('view-menu', 'Ordini Sagra'); document.getElementById('search-bar-container').classList.remove('hidden'); }
        function switchView(id, title) {
            ['view-menu', 'view-summary', 'view-userdata', 'view-qr'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('search-bar-container').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
            document.getElementById('header-title').innerText = title;
            document.getElementById('footer-bar').classList.toggle('hidden', id === 'view-qr');
            const btn = document.getElementById('main-action-btn');
            if (id === 'view-menu') { btn.innerHTML = '<span>Riepilogo</span><i class="fas fa-arrow-right ml-2"></i>'; btn.onclick = goToSummary; }
            else if (id === 'view-summary') { btn.innerHTML = '<span>Prosegui</span><i class="fas fa-arrow-right ml-2"></i>'; btn.onclick = goToUserData; }
            else if (id === 'view-userdata') { btn.innerHTML = '<span>Genera QR</span><i class="fas fa-qrcode ml-2"></i>'; btn.onclick = generateQR; }
        }

        function filterMenu() { state.searchQuery = document.getElementById('search-input').value; document.getElementById('clear-search-btn').style.display = state.searchQuery ? 'block' : 'none'; renderMenu(); }
        function clearSearch() { document.getElementById('search-input').value = ""; filterMenu(); }
        function filterCategory(id) { state.selectedCategory = id; renderCategories(); renderMenu(); }

        function generateQR() {
            const order = {
                numeroTavolo: document.getElementById('input-tavolo').value,
                cliente: document.getElementById('input-cliente').value,
                coperti: parseInt(document.getElementById('input-coperti').value),
                note: document.getElementById('input-note').value || null,
                per_asporto: document.getElementById('input-asporto').checked,
                righe: state.cart.map(item => {
                    let desc = item.articolo.descrizione;
                    let ings = null;
                    if (item.varianti) {
                        ings = Object.entries(item.varianti).map(([id, qta]) => ({ id: parseInt(id), qta }));
                        const p = Object.entries(item.varianti).map(([id, qta]) => {
                            const ing = item.articolo.ingredienti.find(i => i.id == id);
                            return (ing && !ing.obbligatorio) ? (qta > 1 ? qta + ' ' : '') + ing.descrizione : null;
                        }).filter(x => x);
                        if (p.length > 0) desc += " con " + p.join(", ");
                    }
                    return { id: item.articolo.id, qta: item.quantity, descrizione: desc, ingredienti: ings };
                })
            };
            switchView('view-qr', 'Scansiona in Cassa');
            new QRious({ element: document.getElementById('qrcode-canvas'), value: JSON.stringify(order), size: 300 });
        }
    </script>
</body>
</html>
